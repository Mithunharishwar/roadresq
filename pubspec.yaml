name: roadresq
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ─── Routing ───
  go_router: ^14.2.0

  # ─── State Management ───
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Location & Maps ───
  geolocator: ^10.0.0
  google_maps_flutter: ^2.7.0
  flutter_polyline_points: ^2.0.0

  # ─── Networking ───
  http: ^1.2.1
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # ─── Firebase ───
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.0.2
  firebase_database: ^11.0.2
  cloud_firestore: ^5.1.0
  cloud_functions: ^5.1.1
  firebase_storage: ^12.1.3

  # ─── Real-time ───
  socket_io_client: ^2.0.3

  # ─── Payment ───
  razorpay_flutter: ^1.3.6

  # ─── Storage & Security ───
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3

  # ─── UI Components ───
  flutter_tts: ^4.0.2
  mobile_scanner: ^4.0.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1

  # ─── Utilities ───
  uuid: ^4.4.0
  intl: 0.20.2
  url_launcher: ^6.3.0
  sensors_plus: ^4.0.2
  camera: ^0.10.5+9
  permission_handler: ^11.3.3
  image: ^4.2.0
  flutter_local_notifications: ^17.2.1+2
  image_picker: ^1.2.4
  pdf: ^3.12.0
  share_plus: ^12.0.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/vehicles/
    - assets/issues/
    - assets/ml/
