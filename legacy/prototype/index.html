<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RoadResQ - Rescue Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f4f4f4;
    }
    h2 {
      color: #d62828;
    }
    input {
      padding: 10px;
      margin: 8px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      margin: 10px 5px;
      background-color: #023e8a;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0077b6;
    }
    #message {
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <h2>Welcome to RoadResQ</h2>
  <p>Please sign up or log in to get roadside assistance</p>

  <input id="email" type="email" placeholder="Email" /><br>
  <input id="password" type="password" placeholder="Password" /><br>
  <button onclick="signUp()">Sign Up</button>
  <button onclick="logIn()">Log In</button>
  <button onclick="logOut()">Log Out</button>
  <p id="message"></p>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQJlmjJsq86TwNvR-zO7GWKpCPwOYCvrI",
      authDomain: "roadresq-e4b7b.firebaseapp.com",
      projectId: "roadresq-e4b7b",
      storageBucket: "roadresq-e4b7b.appspot.com",
      messagingSenderId: "47837867447",
      appId: "1:47837867447:web:2cc1577aabacb9cf2bcc32",
      measurementId: "G-22B1DBM203"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function signUp() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          document.getElementById("message").innerText = "✅ Account Created!";
        })
        .catch((error) => {
          document.getElementById("message").innerText = "❌ " + error.message;
        });
    }

    function logIn() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = "dashboard.html";

        })
        .catch((error) => {
          document.getElementById("message").innerText = "❌ " + error.message;
        });
    }

    function logOut() {
      auth.signOut().then(() => {
        document.getElementById("message").innerText = "✅ Logged Out!";
      });
    }
  </script>
</body>
</html>
