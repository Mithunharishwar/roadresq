<!DOCTYPE html>
<html>
<head>
  <title>RoadResQ - Rescue Portal</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; background: #f9f9f9; }
    h1 { color: #c62828; }
    button { margin-top: 10px; padding: 10px 20px; background: #c62828; color: white; border: none; cursor: pointer; }
    #map { height: 400px; width: 100%; margin-top: 20px; }
    input { display: block; margin: 8px 0; padding: 8px; width: 100%; max-width: 300px; }
    #message, #rescueStatus { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🛠️ RoadResQ Login</h1>

  <input type="email" id="email" placeholder="Enter Email" />
  <input type="password" id="password" placeholder="Enter Password" />

  <button onclick="signUp()">Create Account</button>
  <button onclick="logIn()">Log In</button>
  <button onclick="logOut()">Log Out</button>

  <p id="message"></p>

  <hr>

  <h2>🚨 Request Emergency Rescue</h2>
  <button onclick="requestRescue()">Request Rescue</button>
  <p id="rescueStatus"></p>

  <div id="map"></div>

  <script>
    // 🔑 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDQJlmjJsq86TwNvR-zO7GWKpCPwOYCvrI",
      authDomain: "roadresq-e4b7b.firebaseapp.com",
      projectId: "roadresq-e4b7b",
      storageBucket: "roadresq-e4b7b.appspot.com",
      messagingSenderId: "47837867447",
      appId: "1:47837867447:web:2cc1577aabacb9cf2bcc32",
      measurementId: "G-22B1DBM203"
    };

    // 🔥 Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let map;
    let marker;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 0, lng: 0 },
        zoom: 2
      });
    }

    // ✅ Sign Up
    function signUp() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          document.getElementById("message").innerText = "✅ Account Created!";
        })
        .catch((error) => {
          document.getElementById("message").innerText = "❌ " + error.message;
        });
    }

    // ✅ Log In
    function logIn() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          document.getElementById("message").innerText = "✅ Logged In!";
        })
        .catch((error) => {
          document.getElementById("message").innerText = "❌ " + error.message;
        });
    }

    // ✅ Log Out
    function logOut() {
      auth.signOut()
        .then(() => {
          document.getElementById("message").innerText = "✅ Logged Out!";
        });
    }

    // 🚨 Request Rescue
    function requestRescue() {
      const status = document.getElementById("rescueStatus");

      if (!auth.currentUser) {
        status.innerText = "❌ You must be logged in to request rescue.";
        return;
      }

      if (!navigator.geolocation) {
        status.innerText = "❌ Geolocation not supported.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const userEmail = auth.currentUser.email.replace('.', '_');

          const rescueData = {
            email: auth.currentUser.email,
            lat: lat,
            lng: lng,
            timestamp: new Date().toISOString()
          };

          db.ref("rescues/" + userEmail).set(rescueData)
            .then(() => {
              status.innerText = "✅ Rescue request submitted!";
            });

          const location = { lat, lng };
          map.setCenter(location);
          map.setZoom(15);

          if (marker) marker.setMap(null);
          marker = new google.maps.Marker({
            position: location,
            map: map,
            title: "Rescue Location"
          });
        },
        (error) => {
          status.innerText = "❌ Unable to fetch location.";
        }
      );
    }
  </script>

  <!-- 🌍 Load Google Maps -->
  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBYBxYYKT-qhUf_n7WihncoV0Uc1eEdxGQ&callback=initMap">
  </script>

</body>
</html>
