name: CI

# Mirrors scripts/verify.sh: static analysis, backend tests, cloud-function syntax.
# Run that script locally before pushing to catch failures the same way CI does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Pin an exact SDK here if CI and local tooling ever disagree:
      #   flutter-version: '3.41.4'
      - run: flutter pub get
      - run: flutter analyze

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  functions-syntax:
    name: Cloud function syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Syntax only: `node --check` needs no dependencies installed.
      - run: for f in functions/*.js; do node --check "$f"; done
